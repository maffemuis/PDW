name: Apply Filter Find theme once

on:
  push:
    branches:
      - modernization/windows11-ui
    paths:
      - .github/workflows/apply-filter-find-theme-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization/windows11-ui
          fetch-depth: 0

      - name: Apply bounded Filter Find theme patch
        shell: cmd
        run: python .github\scripts\apply_filter_find_theme.py

      - name: Commit Filter Find renderer patch
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/windows11_ui.cpp
          git commit -m "Theme Filter Find dialog and finish Dutch text"
          git push origin HEAD:modernization/windows11-ui
