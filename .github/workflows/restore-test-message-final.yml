name: Restore TEST message on exact head

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - .github/workflows/restore-test-message-final.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent and source
        shell: bash
        run: |
          set -euo pipefail
          BASE=ffcf8b139114d88b11b2f537ee7cd1deb2b73092
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "${GITHUB_REF_NAME}" = "modernization/filter-editor-usability"
          git fetch --no-tags origin modernization/synthetic-groupcall-guard
          test "$(git rev-parse FETCH_HEAD)" = "658230d4a11f1e2a7fee1df33d078a6bd2c7816c"

      - name: Port bounded TEST message
        shell: bash
        run: |
          set -euo pipefail
          SRC=658230d4a11f1e2a7fee1df33d078a6bd2c7816c
          for path in core/legacy_message_projection.h core/legacy_message_projection.cpp core/synthetic_message.h core/synthetic_message.cpp core/synthetic_injection_policy.h core/synthetic_injection_policy.cpp utils/synthetic_injection.h utils/synthetic_injection.cpp tests/core/legacy_message_projection_test.cpp tests/core/synthetic_message_test.cpp tests/core/synthetic_injection_policy_test.cpp tests/core/synthetic_mail_contract_test.cpp; do
            mkdir -p "$(dirname "$path")"
            git show "$SRC:$path" > "$path"
          done
          git show "$SRC:tests/CMakeLists.txt" > /tmp/synthetic-tests-cmake.txt
          python3 - <<'PY'
          from pathlib import Path

          def add_after(path, anchor, addition):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if addition.strip() in s:
                  return
              count = s.count(anchor)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count {count}')
              p.write_text(s.replace(anchor, anchor + addition, 1), encoding='utf-8')

          add_after('core/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.h\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.h\n')
          add_after('core/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.cpp\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.cpp\n')
          add_after('utils/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.h\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.h\n')
          add_after('utils/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.cpp\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.cpp\n')

          tests = Path('tests/CMakeLists.txt')
          current_tests = tests.read_text(encoding='utf-8')
          if 'pdw_synthetic_message_test' not in current_tests:
              source_tests = Path('/tmp/synthetic-tests-cmake.txt').read_text(encoding='utf-8')
              start = source_tests.index('add_executable( pdw_synthetic_message_test')
              end = source_tests.index('add_executable( pdw_filter_text_match_test', start)
              block = source_tests[start:end]
              anchor = 'add_test(\n    NAME pdw_decoded_message\n    COMMAND pdw_decoded_message_test\n)\n\n'
              if current_tests.count(anchor) != 1:
                  raise SystemExit('tests/CMakeLists.txt: decoded-message anchor mismatch')
              tests.write_text(current_tests.replace(anchor, anchor + block, 1), encoding='utf-8')

          def patch_latin1(path, anchor, addition, token):
              p = Path(path)
              s = p.read_bytes().decode('latin-1')
              if token in s:
                  return
              count = s.count(anchor)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count {count}')
              p.write_bytes(s.replace(anchor, anchor + addition, 1).encode('latin-1'))

          resource = Path('Headers/Resource.h')
          resource_text = resource.read_bytes().decode('latin-1')
          resource_nl = '\r\n' if '\r\n' in resource_text else '\n'
          patch_latin1('Headers/Resource.h', '#define IDM_FILTERCOMMANDFILE      245' + resource_nl, '#define IDM_TEST_MESSAGE            246' + resource_nl, 'IDM_TEST_MESSAGE')

          rsrc = Path('Rsrc.rc')
          rsrc_text = rsrc.read_bytes().decode('latin-1')
          if 'Send TEST/SYNTHETIC message...' not in rsrc_text:
              nl = '\r\n' if '\r\n' in rsrc_text else '\n'
              anchor = '        MENUITEM "Filter Command File",         IDM_FILTERCOMMANDFILE' + nl
              if rsrc_text.count(anchor) != 1:
                  raise SystemExit('Rsrc.rc: menu anchor mismatch')
              addition = '        MENUITEM SEPARATOR' + nl + '        MENUITEM "Send TEST/SYNTHETIC message...", IDM_TEST_MESSAGE' + nl
              rsrc.write_bytes(rsrc_text.replace(anchor, anchor + addition, 1).encode('latin-1'))

          pdw = Path('PDW.cpp')
          pdw_text = pdw.read_bytes().decode('latin-1')
          nl = '\r\n' if '\r\n' in pdw_text else '\n'
          if 'utils\\synthetic_injection.h' not in pdw_text:
              include_anchor = '#include "utils\\smtp.h"' + nl
              if pdw_text.count(include_anchor) != 1:
                  raise SystemExit('PDW.cpp: include anchor mismatch')
              pdw_text = pdw_text.replace(include_anchor, include_anchor + '#include "utils\\synthetic_injection.h"' + nl, 1)
          if 'case IDM_TEST_MESSAGE:' not in pdw_text:
              marker = 'case IDM_ABOUT:'
              if pdw_text.count(marker) != 1:
                  raise SystemExit('PDW.cpp: about marker mismatch')
              start = pdw_text.index(marker)
              end = pdw_text.find('break;', start)
              if end < 0:
                  raise SystemExit('PDW.cpp: About break missing')
              end = pdw_text.find(nl, end)
              if end < 0:
                  raise SystemExit('PDW.cpp: About line ending missing')
              end += len(nl)
              lines = ['', '\t\t\t\tcase IDM_TEST_MESSAGE:', '\t\t\t\t\tif (MessageBox(hWnd, "Inject a clearly marked TEST/SYNTHETIC message through the normal filter/action pipeline?\\n\\nCapcode: 1234567\\nText: PDW TEST MESSAGE", "PDW Synthetic Test", MB_YESNO | MB_ICONWARNING | MB_DEFBUTTON2) == IDYES)', '\t\t\t\t\t{', '\t\t\t\t\t\tif (!pdw::InjectDefaultSyntheticTestMessage())', '\t\t\t\t\t\t{', '\t\t\t\t\t\t\tMessageBox(hWnd, "Synthetic test injection was rejected safely.", "PDW Synthetic Test", MB_OK | MB_ICONERROR);', '\t\t\t\t\t\t}', '\t\t\t\t\t}', '\t\t\t\t\tbreak;']
              block = nl.join(lines) + nl
              pdw_text = pdw_text[:end] + block + pdw_text[end:]
          pdw.write_bytes(pdw_text.encode('latin-1'))
          PY

      - name: Verify remove helper commit and push
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Send TEST/SYNTHETIC message' Rsrc.rc
          grep -q 'case IDM_TEST_MESSAGE:' PDW.cpp
          grep -q 'InjectDefaultSyntheticTestMessage' PDW.cpp
          grep -q 'pdw_synthetic_mail_contract' tests/CMakeLists.txt
          rm .github/workflows/restore-test-message-final.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core utils tests PDW.cpp Headers/Resource.h Rsrc.rc .github/workflows/restore-test-message-final.yml
          git diff --cached --check
          git commit -m "Restore bounded TEST synthetic message"
          git fetch origin modernization/filter-editor-usability
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/modernization/filter-editor-usability)"
          git push origin HEAD:modernization/filter-editor-usability
