name: Restore TEST message on exact head

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - .github/workflows/restore-test-message-final.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent and source
        shell: bash
        run: |
          set -euo pipefail
          BASE=f62a4b671d1198f6561242e0e1e8f976b24a86a4
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "${GITHUB_REF_NAME}" = "modernization/filter-editor-usability"
          git fetch --no-tags origin modernization/synthetic-groupcall-guard
          test "$(git rev-parse FETCH_HEAD)" = "658230d4a11f1e2a7fee1df33d078a6bd2c7816c"

      - name: Port bounded TEST message
        shell: bash
        run: |
          set -euo pipefail
          SRC=658230d4a11f1e2a7fee1df33d078a6bd2c7816c
          for path in core/legacy_message_projection.h core/legacy_message_projection.cpp core/synthetic_message.h core/synthetic_message.cpp core/synthetic_injection_policy.h core/synthetic_injection_policy.cpp utils/synthetic_injection.h utils/synthetic_injection.cpp tests/core/legacy_message_projection_test.cpp tests/core/synthetic_message_test.cpp tests/core/synthetic_injection_policy_test.cpp tests/core/synthetic_mail_contract_test.cpp; do
            mkdir -p "$(dirname "$path")"
            git show "$SRC:$path" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          def add_after_utf8(path, anchor, addition):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if addition.strip() in s:
                  return
              if s.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, got {s.count(anchor)}')
              p.write_text(s.replace(anchor, anchor + addition, 1), encoding='utf-8')

          add_after_utf8('core/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.h\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.h\n')
          add_after_utf8('core/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.cpp\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.cpp\n')
          add_after_utf8('utils/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.h\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.h\n')
          add_after_utf8('utils/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.cpp\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.cpp\n')

          tests = Path('tests/CMakeLists.txt')
          t = tests.read_text(encoding='utf-8')
          if 'pdw_synthetic_message_test' not in t:
              anchor = 'add_test(\n    NAME pdw_decoded_message\n    COMMAND pdw_decoded_message_test\n)\n\n'
              if t.count(anchor) != 1:
                  raise SystemExit('tests/CMakeLists.txt: decoded-message anchor mismatch')
              block = '''add_executable( pdw_synthetic_message_test
    core/synthetic_message_test.cpp
    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp
    ${CMAKE_SOURCE_DIR}/core/synthetic_message.cpp
)

target_include_directories( pdw_synthetic_message_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_synthetic_message
    COMMAND pdw_synthetic_message_test
)

add_executable( pdw_synthetic_injection_policy_test
    core/synthetic_injection_policy_test.cpp
    ${CMAKE_SOURCE_DIR}/core/synthetic_injection_policy.cpp
)

target_include_directories( pdw_synthetic_injection_policy_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_synthetic_injection_policy
    COMMAND pdw_synthetic_injection_policy_test
)

add_executable( pdw_legacy_message_projection_test
    core/legacy_message_projection_test.cpp
    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp
    ${CMAKE_SOURCE_DIR}/core/legacy_message_projection.cpp
)

target_include_directories( pdw_legacy_message_projection_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_legacy_message_projection
    COMMAND pdw_legacy_message_projection_test
)

add_executable( pdw_synthetic_mail_contract_test
    core/synthetic_mail_contract_test.cpp
    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp
    ${CMAKE_SOURCE_DIR}/core/synthetic_message.cpp
    ${CMAKE_SOURCE_DIR}/core/legacy_message_projection.cpp
)

target_include_directories( pdw_synthetic_mail_contract_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_synthetic_mail_contract
    COMMAND pdw_synthetic_mail_contract_test
)

'''
              tests.write_text(t.replace(anchor, anchor + block, 1), encoding='utf-8')

          def patch_latin1(path, anchor, addition, token):
              p = Path(path)
              s = p.read_bytes().decode('latin-1')
              if token in s:
                  return
              if s.count(anchor) != 1:
                  raise SystemExit(f'{path}: anchor mismatch ({s.count(anchor)})')
              p.write_bytes(s.replace(anchor, anchor + addition, 1).encode('latin-1'))

          res = Path('Headers/Resource.h')
          res_bytes = res.read_bytes()
          res_nl = '\r\n' if b'\r\n' in res_bytes else '\n'
          patch_latin1('Headers/Resource.h', '#define IDM_FILTERCOMMANDFILE      245' + res_nl, '#define IDM_TEST_MESSAGE            246' + res_nl, 'IDM_TEST_MESSAGE')

          rsrc = Path('Rsrc.rc')
          rs = rsrc.read_bytes().decode('latin-1')
          if 'Send TEST/SYNTHETIC message...' not in rs:
              nl = '\r\n' if '\r\n' in rs else '\n'
              anchor = '        MENUITEM "Filter Command File",         IDM_FILTERCOMMANDFILE' + nl
              if rs.count(anchor) != 1:
                  raise SystemExit(f'Rsrc.rc: menu anchor mismatch ({rs.count(anchor)})')
              add = '        MENUITEM SEPARATOR' + nl + '        MENUITEM "Send TEST/SYNTHETIC message...", IDM_TEST_MESSAGE' + nl
              rsrc.write_bytes(rs.replace(anchor, anchor + add, 1).encode('latin-1'))

          pdw = Path('PDW.cpp')
          ps = pdw.read_bytes().decode('latin-1')
          nl = '\r\n' if '\r\n' in ps else '\n'
          if 'utils\\synthetic_injection.h' not in ps:
              anchor = '#include "utils\\smtp.h"' + nl
              if ps.count(anchor) != 1:
                  raise SystemExit(f'PDW.cpp: include anchor mismatch ({ps.count(anchor)})')
              ps = ps.replace(anchor, anchor + '#include "utils\\synthetic_injection.h"' + nl, 1)
          if 'case IDM_TEST_MESSAGE:' not in ps:
              marker = 'case IDM_ABOUT:'
              if ps.count(marker) != 1:
                  raise SystemExit(f'PDW.cpp: about marker mismatch ({ps.count(marker)})')
              start = ps.index(marker)
              end = ps.find('break;', start)
              if end < 0:
                  raise SystemExit('PDW.cpp: could not locate About break')
              end = ps.find(nl, end)
              if end < 0:
                  raise SystemExit('PDW.cpp: could not locate About line ending')
              end += len(nl)
              indent = '\t\t\t\t'
              block = (nl + indent + 'case IDM_TEST_MESSAGE:' + nl + indent + '\tif (MessageBox(hWnd, "Inject a clearly marked TEST/SYNTHETIC message through the normal filter/action pipeline?\\n\\nCapcode: 1234567\\nText: PDW TEST MESSAGE", "PDW Synthetic Test", MB_YESNO | MB_ICONWARNING | MB_DEFBUTTON2) == IDYES)' + nl + indent + '\t{' + nl + indent + '\t\tif (!pdw::InjectDefaultSyntheticTestMessage())' + nl + indent + '\t\t{' + nl + indent + '\t\t\tMessageBox(hWnd, "Synthetic test injection was rejected safely.", "PDW Synthetic Test", MB_OK | MB_ICONERROR);' + nl + indent + '\t\t}' + nl + indent + '\t}' + nl + indent + '\tbreak;' + nl)
              ps = ps[:end] + block + ps[end:]
          pdw.write_bytes(ps.encode('latin-1'))
          PY

      - name: Verify, remove helper, commit and push
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Send TEST/SYNTHETIC message' Rsrc.rc
          grep -q 'case IDM_TEST_MESSAGE:' PDW.cpp
          grep -q 'InjectDefaultSyntheticTestMessage' PDW.cpp
          grep -q 'pdw_synthetic_mail_contract' tests/CMakeLists.txt
          rm .github/workflows/restore-test-message-final.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core utils tests PDW.cpp Headers/Resource.h Rsrc.rc .github/workflows/restore-test-message-final.yml
          git diff --cached --check
          git commit -m "Restore bounded TEST synthetic message"
          git fetch origin modernization/filter-editor-usability
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/modernization/filter-editor-usability)"
          git push origin HEAD:modernization/filter-editor-usability
