name: One-shot filter display buffer hardening

on:
  push:
    branches:
      - modernization/filter-label-sounds

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded source patch
        run: |
          python tools/patch_filter_display_buffer.py
          git diff --check

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDW.cpp
          git commit -m "Widen filter list display buffer for long labels"
          git push origin HEAD:modernization/filter-label-sounds
