name: PDW serial hardware probe

on:
  push:
    branches:
      - "modernization/filter-editor-usability"

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Verify dedicated PDW runner
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_NAME -ne "pc-soldeerbank-pdw-01") {
            throw "Refusing serial hardware probe on unexpected runner '$env:RUNNER_NAME'. Expected pc-soldeerbank-pdw-01."
          }
          Write-Host "Dedicated PDW runner verified: $env:RUNNER_NAME"

      - name: Inventory Windows serial interfaces
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "pdw-serial-hardware-probe.txt"
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("PDW SERIAL HARDWARE PROBE")
          $lines.Add("runner=$env:RUNNER_NAME")
          $lines.Add("computer=$env:COMPUTERNAME")
          $lines.Add("timestamp_utc=$([DateTime]::UtcNow.ToString('o'))")
          $lines.Add("")

          $lines.Add("[Win32_SerialPort]")
          $ports = @(Get-CimInstance Win32_SerialPort -ErrorAction SilentlyContinue | Sort-Object DeviceID)
          if ($ports.Count -eq 0) {
            $lines.Add("<none>")
          } else {
            foreach ($p in $ports) {
              $lines.Add(("DeviceID={0}; Name={1}; Description={2}; PNPDeviceID={3}; Status={4}" -f $p.DeviceID,$p.Name,$p.Description,$p.PNPDeviceID,$p.Status))
            }
          }
          $lines.Add("")

          $lines.Add("[Registry SERIALCOMM]")
          $serialMap = Get-ItemProperty 'HKLM:\HARDWARE\DEVICEMAP\SERIALCOMM' -ErrorAction SilentlyContinue
          if ($null -eq $serialMap) {
            $lines.Add("<none>")
          } else {
            $props = $serialMap.PSObject.Properties | Where-Object { $_.Name -notmatch '^PS' } | Sort-Object Name
            if (@($props).Count -eq 0) {
              $lines.Add("<none>")
            } else {
              foreach ($prop in $props) {
                $lines.Add(("{0}={1}" -f $prop.Name,$prop.Value))
              }
            }
          }
          $lines.Add("")

          $lines.Add("[PnP Ports]")
          $pnp = @(Get-PnpDevice -Class Ports -ErrorAction SilentlyContinue | Sort-Object FriendlyName)
          if ($pnp.Count -eq 0) {
            $lines.Add("<none>")
          } else {
            foreach ($d in $pnp) {
              $lines.Add(("Status={0}; FriendlyName={1}; InstanceId={2}" -f $d.Status,$d.FriendlyName,$d.InstanceId))
            }
          }

          $lines | Set-Content -Path $out -Encoding utf8
          Get-Content $out

          $pnpOkCom = @($pnp | Where-Object { $_.Status -eq 'OK' -and $_.FriendlyName -match '\(COM\d+\)' })
          if ($pnpOkCom.Count -eq 0) {
            Write-Host "PDW_PROBE_CLASSIFICATION=NO_OK_COM_PORTS_VISIBLE"
          } else {
            $names = @($pnpOkCom | ForEach-Object { if ($_.FriendlyName -match '\((COM\d+)\)') { $Matches[1] } })
            Write-Host "PDW_PROBE_CLASSIFICATION=OK_COM_PORTS_VISIBLE"
            Write-Host ("PDW_PROBE_COM_PORTS=" + (($names | Sort-Object -Unique) -join ','))
          }

      - name: Open COM2 at PDW settings and measure RX activity
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "pdw-serial-hardware-probe.txt"
          $portName = "COM2"
          $durationSeconds = 45
          $serial = [System.IO.Ports.SerialPort]::new($portName, 19200, [System.IO.Ports.Parity]::None, 8, [System.IO.Ports.StopBits]::One)
          $serial.Handshake = [System.IO.Ports.Handshake]::None
          $serial.ReadTimeout = 200
          $serial.WriteTimeout = 200
          $serial.DtrEnable = $false
          $serial.RtsEnable = $false
          $total = 0L
          $firstTick = $null
          $lastTick = $null
          $start = [DateTime]::UtcNow
          try {
            $serial.Open()
            if (-not $serial.IsOpen) { throw "SerialPort.Open returned without an open COM2 handle" }
            Add-Content $out ""
            Add-Content $out "[COM2 bounded open/read]"
            Add-Content $out "configured=19200,8,N,1,Handshake=None,DTR=false,RTS=false"
            Write-Host "COM2 opened successfully at 19200 8N1 no-flow"
            $buffer = New-Object byte[] 4096
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($sw.Elapsed.TotalSeconds -lt $durationSeconds) {
              $available = $serial.BytesToRead
              if ($available -gt 0) {
                $count = [Math]::Min($available, $buffer.Length)
                $read = $serial.Read($buffer, 0, $count)
                if ($read -gt 0) {
                  $total += $read
                  $now = $sw.ElapsedMilliseconds
                  if ($null -eq $firstTick) { $firstTick = $now }
                  $lastTick = $now
                }
              } else {
                Start-Sleep -Milliseconds 20
              }
            }
            Add-Content $out ("open=true; duration_s={0}; rx_bytes={1}; first_rx_ms={2}; last_rx_ms={3}" -f $durationSeconds,$total,$firstTick,$lastTick)
            Write-Host ("PDW_COM2_RX_BYTES=" + $total)
            if ($total -gt 0) {
              Write-Host "PDW_COM2_CLASSIFICATION=COM_OPEN_AND_RX_BYTES_PRESENT"
            } else {
              Write-Host "PDW_COM2_CLASSIFICATION=COM_OPEN_BUT_NO_RX_BYTES_DURING_WINDOW"
            }
          }
          catch {
            Add-Content $out ""
            Add-Content $out "[COM2 bounded open/read]"
            Add-Content $out ("open=false; error=" + $_.Exception.Message)
            Write-Host ("PDW_COM2_CLASSIFICATION=COM_OPEN_FAILED: " + $_.Exception.Message)
            throw
          }
          finally {
            if ($serial.IsOpen) { $serial.Close() }
            $serial.Dispose()
          }

      - name: Upload serial hardware probe
        uses: actions/upload-artifact@v4
        with:
          name: PDW-serial-hardware-probe-${{ github.sha }}
          path: ${{ runner.temp }}/pdw-serial-hardware-probe.txt
          if-no-files-found: error
          retention-days: 30
