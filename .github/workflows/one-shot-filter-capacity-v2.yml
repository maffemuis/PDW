name: One-shot filter capacity patch v2

on:
  push:
    branches:
      - modernization/filter-label-sounds

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(s, old, new, what):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{what}: expected 1 match, got {n}")
              return s.replace(old, new, 1)

          hpath = Path('Headers/pdw.h')
          h = hpath.read_text(encoding='utf-8')
          h = one(h, '#define FILTER_LABEL_LEN    256\t// was 70, see issue #21',
                     '#define FILTER_LABEL_LEN    1024\t// expanded modern label capacity', 'label limit')
          h = one(h, '#define FILTER_FILE_LEN     128\t// PH: was 256',
                     '#define FILTER_FILE_LEN     128\t// PH: was 256\n#define FILTER_SOUND_COUNT  100\t// Sound0.wav through Sound99.wav', 'sound constant')
          hpath.write_text(h, encoding='utf-8')

          ppath = Path('PDW.cpp')
          p = ppath.read_text(encoding='utf-8')
          wave_decl = '\tchar *wave_names[11]  = {"Default","Sound-0","Sound-1","Sound-2","Sound-3","Sound-4",\n\t\t\t\t\t\t\t\t\t   "Sound-5","Sound-6","Sound-7","Sound-8","Sound-9"};'
          p = one(p, wave_decl, '\tchar wave_name[32];', 'wave display table')
          p = one(p,
              '\t\t\tstrcat(temp_str, filter.wave_number == -1 ? "NoSound" : wave_names[filter.wave_number]);',
              '\t\t\tif (filter.wave_number == -1)\n\t\t\t{\n\t\t\t\tstrcat(temp_str, "NoSound");\n\t\t\t}\n\t\t\telse if (filter.wave_number == 0)\n\t\t\t{\n\t\t\t\tstrcat(temp_str, "Default");\n\t\t\t}\n\t\t\telse\n\t\t\t{\n\t\t\t\tsprintf(wave_name, "Sound-%i", filter.wave_number-1);\n\t\t\t\tstrcat(temp_str, wave_name);\n\t\t\t}',
              'dynamic wave display')
          p = one(p, '\t\t\t\tfor (i=0; i<10; i++)', '\t\t\t\tfor (i=0; i<FILTER_SOUND_COUNT; i++)', 'sound combo')
          sentinel = '(Profile.filters[index].monitor_only ? 2 : 12)'
          if p.count(sentinel) != 2:
              raise SystemExit(f'audio sentinel: expected 2 matches, got {p.count(sentinel)}')
          p = p.replace(sentinel, '(Profile.filters[index].monitor_only ? 2 : FILTER_SOUND_COUNT + 2)')
          p = one(p, 'void WriteFilters(PPROFILE pProfile, int backup)\n{\n\tchar szLine[256];',
                     'void WriteFilters(PPROFILE pProfile, int backup)\n{\n\tchar szLine[MAX_STR_LEN];', 'write buffer')

          a = p.index('\t\t\t\t\t\t\tcase FILTER_LABEL:\t\t\t// Get label')
          b = p.index('\t\t\t\t\t\t\tcase FILTER_TEXT:\t\t\t// Get text', a)
          if 'strncpy(filter.label' not in p[a:b]:
              raise SystemExit('legacy label parser not found')
          label_block = '''\t\t\t\t\t\t\tcase FILTER_LABEL:\t\t\t// Get label

\t\t\t\t\t\t\tif (szLine[pos+1] != '\"')
\t\t\t\t\t\t\t{
\t\t\t\t\t\t\t\tconst char *label_start = &szLine[pos+1];
\t\t\t\t\t\t\t\tconst char *label_end = strchr(label_start, '\"');
\t\t\t\t\t\t\t\tif (!label_end)
\t\t\t\t\t\t\t\t{
\t\t\t\t\t\t\t\t\tbError = true;
\t\t\t\t\t\t\t\t\tbreak;
\t\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t\tconst size_t label_len = static_cast<size_t>(label_end - label_start);
\t\t\t\t\t\t\t\tif (label_len > FILTER_LABEL_LEN)
\t\t\t\t\t\t\t\t{
\t\t\t\t\t\t\t\t\tbError = true;
\t\t\t\t\t\t\t\t\tbreak;
\t\t\t\t\t\t\t\t}
\t\t\t\t\t\t\t\tmemcpy(filter.label, label_start, label_len);
\t\t\t\t\t\t\t\tfilter.label[label_len] = 0;
\t\t\t\t\t\t\t\tpos = static_cast<int>(label_end - szLine);
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\telse filter.label[0] = 0;

\t\t\t\t\t\t\tbreak;

'''
          p = p[:a] + label_block + p[b:]
          ppath.write_text(p, encoding='utf-8')

          mpath = Path('Misc.cpp')
          m = mpath.read_text(encoding='utf-8')
          m = one(m, '#define FILTER_PARAM_LEN\t500', '#define FILTER_PARAM_LEN\t(MAX_STR_LEN - 1)', 'command capacity')
          marker = 'void display_show_strV2(PaneStruct *pane, char strin[])\n{\n\tfor (int x=0; ((strin[x] != 0) && (x < 256)); x++)\n\t{\n\t\tbuild_show_line(pane, strin[x], 0);\n\t}\n}\n'
          helper = marker + '\nvoid display_show_filter_label(PaneStruct *pane, const char strin[])\n{\n\tfor (int x=0; ((strin[x] != 0) && (x < FILTER_LABEL_LEN)); x++)\n\t{\n\t\tbuild_show_line(pane, strin[x], 0);\n\t}\n}\n'
          m = one(m, marker, helper, 'label display helper')
          for pane, expected in [('Pane1', 2), ('Pane2', 1)]:
              old = f'display_show_strV2(&{pane}, szCurrentLabel[0])'
              if m.count(old) != expected:
                  raise SystemExit(f'{pane} label display: expected {expected}, got {m.count(old)}')
              m = m.replace(old, f'display_show_filter_label(&{pane}, szCurrentLabel[0])')
          m = one(m, 'if ((i > 254) || (arg_pos > FILTER_PARAM_LEN)) break;',
                     'if ((i > 254) || (arg_pos >= FILTER_PARAM_LEN)) break;', 'outer command bound')
          m = one(m, 'for (pos=0; Current_MSG[arg][pos] != 0; pos++, arg_pos++)',
                     'for (pos=0; Current_MSG[arg][pos] != 0 && arg_pos < FILTER_PARAM_LEN; pos++, arg_pos++)', 'message command bound')
          m = one(m, 'while (szLabel[pos] != 0)',
                     'while (szLabel[pos] != 0 && arg_pos < FILTER_PARAM_LEN)', 'label command bound')
          if m.count('while (tmp[pos] != 0)') != 2:
              raise SystemExit('cycle/frame command loops changed')
          m = m.replace('while (tmp[pos] != 0)', 'while (tmp[pos] != 0 && arg_pos < FILTER_PARAM_LEN)')
          old_cmd = '\tstrcpy(szCommandFile, Profile.filter_cmd);\n\n\tif (param_str[0])\n\t{\n\t\tstrcat(szCommandFile, " ");\n\t\tstrcat(szCommandFile, param_str);\n\t}\n\tif (strlen(szCommandFile) > MAX_STR_LEN) szCommandFile[MAX_STR_LEN] = 0;'
          new_cmd = '\t_snprintf(szCommandFile, sizeof(szCommandFile)-1, "%s%s%s",\n\t\tProfile.filter_cmd, param_str[0] ? " " : "", param_str);\n\tszCommandFile[sizeof(szCommandFile)-1] = \'\\0\';'
          m = one(m, old_cmd, new_cmd, 'bounded command line')
          mpath.write_text(m, encoding='utf-8')

          assert 'FILTER_LABEL_LEN    1024' in h
          assert 'FILTER_SOUND_COUNT  100' in h
          assert 'wave_names[11]' not in p
          PY
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Headers/pdw.h PDW.cpp Misc.cpp
          git diff --cached --check
          git commit -m "Expand filter labels and configurable sounds"
          git push origin HEAD:modernization/filter-label-sounds
