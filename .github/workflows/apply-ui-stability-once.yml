name: Apply UI stability lane once

on:
  push:
    branches:
      - modernization/windows11-ui
    paths:
      - .github/workflows/apply-ui-stability-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization/windows11-ui
          fetch-depth: 0

      - name: Apply bounded UI stability patch
        shell: cmd
        run: python .github\scripts\apply_ui_stability.py

      - name: Commit UI stability lane
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/windows11_ui.cpp utils/ui_theme.cpp
          git commit -m "Stabilize modern UI repaint and live RX presentation"
          git push origin HEAD:modernization/windows11-ui
