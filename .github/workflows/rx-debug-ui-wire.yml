name: Wire RX debug UI

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - .github/workflows/rx-debug-ui-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "857e7047b95fb5af5c160abb67f5ffc05522ae16"
          test "${GITHUB_REF_NAME}" = "modernization/filter-editor-usability"

      - name: Apply byte-preserving patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_rx_debug_ui.py

      - name: Remove one-shot files and verify
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rx-debug-ui-wire.yml
          rm tools/patch_rx_debug_ui.py
          git diff --check
          test -n "$(git status --short)"

      - name: Commit and push exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDW.cpp Headers/Resource.h Rsrc.rc .github/workflows/rx-debug-ui-wire.yml tools/patch_rx_debug_ui.py
          git diff --cached --check
          git commit -m "Expose RX diagnostics and Nick ECO AI build identity"
          git fetch origin modernization/filter-editor-usability
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/modernization/filter-editor-usability)"
          git push origin HEAD:modernization/filter-editor-usability
