name: PDW General Options UI modernize once

on:
  push:
    branches:
      - tmp/general-options-ui-apply
    paths:
      - .github/workflows/general-options-ui-modernize-once.yml
      - .github/scripts/general-options-ui-modernize-once.ps1

permissions:
  contents: write

jobs:
  patch-general-options-ui:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: tmp/general-options-ui-apply
          fetch-depth: 0

      - name: Apply bounded General Options presentation patch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: .github/scripts/general-options-ui-modernize-once.ps1
