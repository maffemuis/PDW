name: PDW Interface Setup UI modernize once

on:
  push:
    branches:
      - tmp/interface-setup-ui-apply
    paths:
      - .github/workflows/interface-setup-ui-modernize-once.yml
      - .github/scripts/interface-setup-ui-modernize-once.ps1

permissions:
  contents: write

jobs:
  patch-interface-setup-ui:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: tmp/interface-setup-ui-apply
          fetch-depth: 0

      - name: Apply bounded Interface Setup presentation patch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: .github/scripts/interface-setup-ui-modernize-once.ps1
