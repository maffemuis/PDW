name: Build PDW (Win32)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "modernization/**"
  pull_request:
    branches: [ master ]

jobs:
  build:
    # Preserve the existing VS2022 build baseline while the decoder behavior
    # is being captured. windows-latest currently maps to a VS2026 image.
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare self-hosted VS2022 toolchain
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"

          $cmake = Get-Command cmake.exe -ErrorAction SilentlyContinue
          if (-not $cmake) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              throw "CMake is not on PATH and vswhere.exe was not found. Install Visual Studio 2022 C++ build tools with the CMake component on the PDW runner."
            }

            $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
            if (-not $vsInstall) {
              throw "Visual Studio 2022 C++ build tools were not found on the PDW runner."
            }

            $cmakeDir = Join-Path $vsInstall "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
            $cmakeExe = Join-Path $cmakeDir "cmake.exe"
            if (-not (Test-Path $cmakeExe)) {
              throw "Visual Studio was found at '$vsInstall', but its CMake component is missing at '$cmakeExe'."
            }

            $cmakeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Using Visual Studio bundled CMake: $cmakeExe"
          }
          else {
            Write-Host "Using CMake from PATH: $($cmake.Source)"
          }

          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          if (-not $python) {
            throw "python.exe is not on PATH on the PDW runner. Python 3 is required for preservation fixture generation."
          }
          Write-Host "Using Python: $($python.Source)"

      - name: Configure CMake (Win32 / Release)
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON

      - name: Build
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          cmake --build build --config Release

      - name: Run preservation tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Run end-to-end silence replay
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"

          $fixture = (Resolve-Path ".\tests\preservation\fixtures\silence-44100-mono8.wav").Path
          $expected = (Resolve-Path ".\tests\preservation\golden\silence.jsonl").Path
          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $compare = (Resolve-Path ".\build\tests\Release\pdw_preservation_compare.exe").Path

          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          $capture = Join-Path $outputDir "silence.full.jsonl"
          $actual = Join-Path $outputDir "silence.actual.jsonl"
          [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
          [System.IO.File]::WriteAllBytes($actual, [byte[]]@())

          $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
          $env:PDW_PRESERVATION_CAPTURE = $capture
          $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
          $env:PDW_PRESERVATION_REPLAY_EXIT = "1"

          try {
            $process = Start-Process `
              -FilePath $pdw `
              -WorkingDirectory $PWD `
              -PassThru

            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw "PDW preservation replay did not exit within 30 seconds"
            }

            if ($process.ExitCode -ne 0) {
              throw "PDW preservation replay exited with code $($process.ExitCode)"
            }

            & $compare $expected $actual
            if ($LASTEXITCODE -ne 0) {
              throw "silence golden comparison failed"
            }
          }
          finally {
            Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
          }

      - name: Run synthetic POCSAG rate matrix
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"

          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $compare = (Resolve-Path ".\build\tests\Release\pdw_preservation_compare.exe").Path
          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          $cases = @(
            @{ Baud = 512;  Golden = ".\tests\preservation\golden\pocsag-512-alpha.jsonl" },
            @{ Baud = 1200; Golden = ".\tests\preservation\golden\pocsag-1200-alpha.jsonl" },
            @{ Baud = 2400; Golden = ".\tests\preservation\golden\pocsag-2400-alpha.jsonl" }
          )

          foreach ($case in $cases) {
            $baud = $case["Baud"]
            $expected = (Resolve-Path $case["Golden"]).Path
            $fixture = Join-Path $outputDir "pocsag-$baud-alpha.wav"

            python .\tests\preservation\generate_pocsag_fixture.py $fixture $baud alpha
            if ($LASTEXITCODE -ne 0) {
              throw "synthetic POCSAG-$baud fixture generation failed"
            }

            $capture = Join-Path $outputDir "pocsag-$baud-alpha.full.jsonl"
            $actual = Join-Path $outputDir "pocsag-$baud-alpha.actual.jsonl"
            [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
            [System.IO.File]::WriteAllBytes($actual, [byte[]]@())

            $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
            $env:PDW_PRESERVATION_CAPTURE = $capture
            $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
            $env:PDW_PRESERVATION_REPLAY_EXIT = "1"

            try {
              $process = Start-Process `
                -FilePath $pdw `
                -WorkingDirectory $PWD `
                -PassThru

              if (-not $process.WaitForExit(30000)) {
                $process.Kill()
                throw "PDW synthetic POCSAG-$baud replay did not exit within 30 seconds"
              }

              if ($process.ExitCode -ne 0) {
                throw "PDW synthetic POCSAG-$baud replay exited with code $($process.ExitCode)"
              }

              & $compare $expected $actual
              if ($LASTEXITCODE -ne 0) {
                Write-Host "Expected POCSAG-$baud golden:"
                Get-Content $expected
                Write-Host "Actual POCSAG-$baud golden:"
                Get-Content $actual
                throw "synthetic POCSAG-$baud golden comparison failed"
              }
            }
            finally {
              Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
              Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
              Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
              Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
            }
          }

      - name: Run synthetic POCSAG tone-only replay
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"

          $expected = (Resolve-Path ".\tests\preservation\golden\pocsag-1200-tone.jsonl").Path
          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $compare = (Resolve-Path ".\build\tests\Release\pdw_preservation_compare.exe").Path
          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          $fixture = Join-Path $outputDir "pocsag-1200-tone.wav"
          python .\tests\preservation\generate_pocsag_fixture.py $fixture 1200 tone
          if ($LASTEXITCODE -ne 0) {
            throw "synthetic POCSAG tone-only fixture generation failed"
          }

          $capture = Join-Path $outputDir "pocsag-1200-tone.full.jsonl"
          $actual = Join-Path $outputDir "pocsag-1200-tone.actual.jsonl"
          [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
          [System.IO.File]::WriteAllBytes($actual, [byte[]]@())

          $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
          $env:PDW_PRESERVATION_CAPTURE = $capture
          $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
          $env:PDW_PRESERVATION_REPLAY_EXIT = "1"

          try {
            $process = Start-Process `
              -FilePath $pdw `
              -WorkingDirectory $PWD `
              -PassThru

            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw "PDW synthetic POCSAG tone-only replay did not exit within 30 seconds"
            }

            if ($process.ExitCode -ne 0) {
              throw "PDW synthetic POCSAG tone-only replay exited with code $($process.ExitCode)"
            }

            & $compare $expected $actual
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Expected tone-only golden:"
              Get-Content $expected
              Write-Host "Actual tone-only golden:"
              Get-Content $actual
              throw "synthetic POCSAG tone-only golden comparison failed"
            }
          }
          finally {
            Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
          }

      - name: Run synthetic FLEX-1600 golden matrix
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"

          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $compare = (Resolve-Path ".\build\tests\Release\pdw_preservation_compare.exe").Path
          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          $cases = @(
            @{ Kind = "tone";  Golden = ".\tests\preservation\golden\flex-1600-tone.jsonl" },
            @{ Kind = "alpha"; Golden = ".\tests\preservation\golden\flex-1600-alpha.jsonl" },
            @{ Kind = "frag0"; Golden = ".\tests\preservation\golden\flex-1600-frag0.jsonl" },
            @{ Kind = "frag1"; Golden = ".\tests\preservation\golden\flex-1600-frag1.jsonl" },
            @{ Kind = "frag2"; Golden = ".\tests\preservation\golden\flex-1600-frag2.jsonl" }
          )

          foreach ($case in $cases) {
            $kind = $case["Kind"]
            $expected = (Resolve-Path $case["Golden"]).Path
            $fixture = Join-Path $outputDir "flex-1600-$kind.wav"
            $capture = Join-Path $outputDir "flex-1600-$kind.full.jsonl"
            $actual = Join-Path $outputDir "flex-1600-$kind.actual.jsonl"
            $diagnostic = Join-Path $outputDir "flex-1600-$kind.diagnostic.json"

            python .\tests\preservation\generate_flex_fixture.py $fixture $kind
            if ($LASTEXITCODE -ne 0) {
              throw "synthetic FLEX-1600 $kind fixture generation failed"
            }

            [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
            [System.IO.File]::WriteAllBytes($actual, [byte[]]@())
            Remove-Item $diagnostic -ErrorAction SilentlyContinue

            $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
            $env:PDW_PRESERVATION_CAPTURE = $capture
            $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
            $env:PDW_PRESERVATION_FLEX_DIAGNOSTIC = $diagnostic
            $env:PDW_PRESERVATION_REPLAY_EXIT = "1"

            try {
              $process = Start-Process `
                -FilePath $pdw `
                -WorkingDirectory $PWD `
                -PassThru

              if (-not $process.WaitForExit(30000)) {
                $process.Kill()
                throw "PDW synthetic FLEX-1600 $kind replay did not exit within 30 seconds"
              }

              if ($process.ExitCode -ne 0) {
                throw "PDW synthetic FLEX-1600 $kind replay exited with code $($process.ExitCode)"
              }

              & $compare $expected $actual
              if ($LASTEXITCODE -ne 0) {
                Write-Host "Expected FLEX-1600 $kind golden:"
                Get-Content $expected
                Write-Host "Actual FLEX-1600 $kind golden:"
                Get-Content $actual
                Write-Host "FLEX replay diagnostic:"
                if (Test-Path $diagnostic) {
                  Get-Content $diagnostic
                }
                else {
                  Write-Host "<diagnostic file missing>"
                }
                throw "synthetic FLEX-1600 $kind golden comparison failed"
              }
            }
            finally {
              Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
              Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
              Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
              Remove-Item Env:PDW_PRESERVATION_FLEX_DIAGNOSTIC -ErrorAction SilentlyContinue
              Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
            }
          }

      - name: Run synthetic ACARS basic replay
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"

          $expected = (Resolve-Path ".\tests\preservation\golden\acars-basic.jsonl").Path
          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $compare = (Resolve-Path ".\build\tests\Release\pdw_preservation_compare.exe").Path
          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          $fixture = Join-Path $outputDir "acars-basic.wav"
          python .\tests\preservation\generate_acars_fixture.py $fixture
          if ($LASTEXITCODE -ne 0) {
            throw "synthetic ACARS fixture generation failed"
          }

          $capture = Join-Path $outputDir "acars-basic.full.jsonl"
          $actual = Join-Path $outputDir "acars-basic.actual.jsonl"
          [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
          [System.IO.File]::WriteAllBytes($actual, [byte[]]@())

          $env:PDW_PRESERVATION_PROTOCOL = "acars"
          $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
          $env:PDW_PRESERVATION_CAPTURE = $capture
          $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
          $env:PDW_PRESERVATION_REPLAY_EXIT = "1"

          try {
            $process = Start-Process `
              -FilePath $pdw `
              -WorkingDirectory $PWD `
              -PassThru

            if (-not $process.WaitForExit(30000)) {
              $process.Kill()
              throw "PDW synthetic ACARS replay did not exit within 30 seconds"
            }

            if ($process.ExitCode -ne 0) {
              throw "PDW synthetic ACARS replay exited with code $($process.ExitCode)"
            }

            & $compare $expected $actual
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Expected ACARS golden:"
              Get-Content $expected
              Write-Host "Actual ACARS golden:"
              Get-Content $actual
              throw "synthetic ACARS golden comparison failed"
            }
          }
          finally {
            Remove-Item Env:PDW_PRESERVATION_PROTOCOL -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDW-Win32-Release
          path: build\Release\PDW.exe
          if-no-files-found: error