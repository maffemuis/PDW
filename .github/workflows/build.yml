name: Build PDW (Win32)

on:
  push:
    branches:
      - modernization/filter-label-sounds

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded filter changes
        shell: pwsh
        run: |
          python .\tools\patch_filter_capacity.py
          if ($LASTEXITCODE -ne 0) { throw "source patch failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "patched source failed git diff --check" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Headers/pdw.h PDW.cpp Misc.cpp
          git commit -m "Expand filter labels and configurable sounds"
          if ($LASTEXITCODE -ne 0) { throw "source patch commit failed" }
          git push origin HEAD:modernization/filter-label-sounds
          if ($LASTEXITCODE -ne 0) { throw "source patch push failed" }

      - name: Configure CMake (Win32 / Release)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
