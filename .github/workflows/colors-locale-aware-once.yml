name: PDW Colors locale-aware once

on:
  push:
    branches:
      - tmp/colors-locale-aware-fix
    paths:
      - .github/workflows/colors-locale-aware-once.yml
      - .github/scripts/colors-locale-aware-once.ps1

permissions:
  contents: write

jobs:
  patch-colors-locale:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: tmp/colors-locale-aware-fix
          fetch-depth: 0
      - name: Apply language-aware Colors localization
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: .github/scripts/colors-locale-aware-once.ps1
