name: Route PDW CI to dedicated self-hosted runner (one-shot)

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - .github/workflows/pdw-route-self-hosted-once.yml

permissions:
  contents: write

jobs:
  patch-runner-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: modernization/filter-editor-usability
          fetch-depth: 0

      - name: Route PDW workflows to dedicated Windows self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('.github/workflows/build.yml'),
              Path('.github/workflows/p2000-bounds.yml'),
              Path('.github/workflows/p2000-hardening.yml'),
              Path('.github/workflows/p2000-quality-matrix.yml'),
              Path('.github/workflows/p2000-sync-matrix.yml'),
          ]
          old = 'runs-on: windows-2022'
          new = 'runs-on: [self-hosted, Windows, X64]'

          for path in targets:
              data = path.read_text(encoding='utf-8')
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
              path.write_text(data.replace(old, new), encoding='utf-8', newline='')
              print(f'patched {path}')
          PY

      - name: Verify routing and commit once
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/build.yml \
            .github/workflows/p2000-bounds.yml \
            .github/workflows/p2000-hardening.yml \
            .github/workflows/p2000-quality-matrix.yml \
            .github/workflows/p2000-sync-matrix.yml; do
            grep -Fq 'runs-on: [self-hosted, Windows, X64]' "$f"
            if grep -Fq 'runs-on: windows-2022' "$f"; then
              echo "stale windows-2022 routing remains in $f" >&2
              exit 1
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pdw-route-self-hosted-once.yml
          git add \
            .github/workflows/build.yml \
            .github/workflows/p2000-bounds.yml \
            .github/workflows/p2000-hardening.yml \
            .github/workflows/p2000-quality-matrix.yml \
            .github/workflows/p2000-sync-matrix.yml

          git diff --cached --check
          git diff --cached --exit-code && { echo 'No routing changes staged' >&2; exit 1; } || true
          git commit -m 'Route PDW Actions to dedicated self-hosted runner'
          git push origin HEAD:modernization/filter-editor-usability
