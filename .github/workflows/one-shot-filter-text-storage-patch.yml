name: One-shot filter text storage patch

on:
  push:
    branches:
      - modernization/filter-editor-usability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization/filter-editor-usability
          fetch-depth: 0

      - name: Apply byte-safe legacy patch
        run: python3 tools/apply_filter_text_storage_patch.py

      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Headers/pdw.h PDW.cpp; then
            echo "Legacy storage patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Headers/pdw.h PDW.cpp
          git commit -m "Integrate bounded filter text storage"
          git push origin HEAD:modernization/filter-editor-usability
