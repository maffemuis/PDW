name: PDW Colors UI localize once

on:
  push:
    branches:
      - tmp/colors-ui-localize-apply
    paths:
      - .github/workflows/colors-ui-localize-once.yml
      - .github/scripts/colors-ui-localize-once.ps1

permissions:
  contents: write

jobs:
  patch-colors-ui:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: tmp/colors-ui-localize-apply
          fetch-depth: 0

      - name: Apply bounded Colors presentation and localization patch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: .github/scripts/colors-ui-localize-once.ps1
