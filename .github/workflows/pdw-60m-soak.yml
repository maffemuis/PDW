name: PDW 60m exact-head soak

on:
  push:
    branches:
      - modernization/filter-editor-usability
  workflow_dispatch:

concurrency:
  group: pdw-60m-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: windows-2022
    timeout-minutes: 80

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record exact-head identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "stale checkout: expected ${{ github.sha }}, got $actual"
          }
          "sha=$actual" | Set-Content -Encoding ascii soak-head.txt
          "started_utc=$([DateTime]::UtcNow.ToString('o'))" | Add-Content -Encoding ascii soak-head.txt

      - name: Configure Win32 Release
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON

      - name: Build Win32 Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Full preservation and regression suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create portable Release artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item build\Release\PDW.exe portable\PDW.exe
          Get-FileHash portable\PDW.exe -Algorithm SHA256 | Format-List | Out-File portable\PDW.exe.sha256.txt -Encoding ascii
          Copy-Item License portable\License
          Copy-Item Readme portable\Readme

      - name: Generate deterministic mixed-rate stress fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force soak-evidence | Out-Null
          @'
          import hashlib
          import struct
          from pathlib import Path

          SYNC = 0x7CD215D8
          IDLE = 0x7A89C197
          CRC_GENERATOR = 0x769
          SAMPLE_RATE = 44100
          PREAMBLE_BITS = 576

          def crc21(info):
              denominator = CRC_GENERATOR << 20
              value = info << 10
              for column in range(21):
                  if (value >> (30 - column)) & 1:
                      value ^= denominator
                  denominator >>= 1
              return value & 0x3ff

          def parity(value):
              result = 0
              for _ in range(32):
                  result ^= value & 1
                  value >>= 1
              return result

          def encode_codeword(info):
              with_crc = (info << 10) | crc21(info)
              return (with_crc << 1) | parity(with_crc)

          def word_bits(word):
              return [(word >> (31 - bit)) & 1 for bit in range(32)]

          def encode_alpha(text):
              payload_bits = []
              for char in text.encode('ascii'):
                  payload_bits.extend((char >> bit) & 1 for bit in range(7))
              words = []
              for offset in range(0, len(payload_bits), 20):
                  chunk = payload_bits[offset:offset + 20]
                  chunk.extend([0] * (20 - len(chunk)))
                  payload = 0
                  for bit in chunk:
                      payload = (payload << 1) | bit
                  words.append(encode_codeword(0x100000 | payload))
              return words

          def transmission(capcode, text, baud):
              assert capcode & 7 == 0
              address = encode_codeword(((capcode >> 3) << 2) | 3)
              message = encode_alpha(text)
              batch = [address, *message]
              if len(batch) > 16:
                  raise RuntimeError('stress message exceeds one batch')
              batch.extend([IDLE] * (16 - len(batch)))
              bits = [1 if i % 2 == 0 else 0 for i in range(PREAMBLE_BITS)]
              bits.extend(word_bits(SYNC))
              for word in batch:
                  bits.extend(word_bits(word))
              count = (len(bits) * SAMPLE_RATE + baud - 1) // baud
              pcm = bytearray(count)
              for sample_index in range(count):
                  bit_index = min((sample_index * baud) // SAMPLE_RATE, len(bits) - 1)
                  pcm[sample_index] = 0xff if bits[bit_index] else 0x00
              return bytes(pcm)

          # Mixed 512/1200/2400 traffic. Repeated entries deliberately create
          # duplicates and back-to-back bursts. 1200-baud messages model the
          # P2000/POCSAG path with several deterministic synthetic capcodes.
          cases = [
              (123456, 'PDW SOAK 512 A', 512),
              (123464, 'P2000 SOAK A', 1200),
              (123472, 'P2000 SOAK B', 1200),
              (123464, 'P2000 SOAK A', 1200),
              (123480, 'PDW SOAK 2400 A', 2400),
              (123488, 'PDW SOAK 512 B', 512),
              (123496, 'P2000 SOAK C', 1200),
              (123480, 'PDW SOAK 2400 A', 2400),
          ]
          silence = bytes([0x80]) * 2205  # 50 ms separator between groups
          pcm = bytearray()
          for index, case in enumerate(cases):
              pcm.extend(transmission(*case))
              # Alternating no-gap/gap produces burst and separated traffic.
              if index % 2:
                  pcm.extend(silence)

          wav = (
              b'RIFF' + struct.pack('<I', 36 + len(pcm)) + b'WAVE' + b'fmt ' +
              struct.pack('<IHHIIHH', 16, 1, 1, SAMPLE_RATE, SAMPLE_RATE, 1, 8) +
              b'data' + struct.pack('<I', len(pcm)) + bytes(pcm)
          )
          out = Path('soak-evidence/mixed-pocsag-p2000.wav')
          out.write_bytes(wav)
          digest = hashlib.sha256(wav).hexdigest()
          Path('soak-evidence/fixture.sha256').write_text(digest + '\n', encoding='ascii')
          print(f'fixture bytes={len(wav)} sha256={digest}')
          '@ | Set-Content -Encoding utf8 soak-evidence\make_stress_fixture.py
          python soak-evidence\make_stress_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'stress fixture generation failed' }
          python soak-evidence\make_stress_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'stress fixture regeneration failed' }
          $hash1 = (Get-Content soak-evidence\fixture.sha256).Trim()
          $hash2 = (Get-FileHash soak-evidence\mixed-pocsag-p2000.wav -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash1 -ne $hash2) { throw "fixture is not deterministic: $hash1 != $hash2" }

      - name: Prove deterministic mixed replay before soak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pdw = (Resolve-Path '.\build\Release\PDW.exe').Path
          $fixture = (Resolve-Path '.\soak-evidence\mixed-pocsag-p2000.wav').Path
          $outputs = @()
          foreach ($n in 1..2) {
            $capture = Join-Path $PWD "soak-evidence\determinism-$n.full.jsonl"
            $golden = Join-Path $PWD "soak-evidence\determinism-$n.messages.jsonl"
            [IO.File]::WriteAllBytes($capture, [byte[]]@())
            [IO.File]::WriteAllBytes($golden, [byte[]]@())
            $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
            $env:PDW_PRESERVATION_CAPTURE = $capture
            $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $golden
            $env:PDW_PRESERVATION_REPLAY_EXIT = '1'
            $p = Start-Process -FilePath $pdw -WorkingDirectory $PWD -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'determinism replay timed out' }
            if ($p.ExitCode -ne 0) { throw "determinism replay failed rc=$($p.ExitCode)" }
            $outputs += (Get-FileHash $golden -Algorithm SHA256).Hash
          }
          if ($outputs[0] -ne $outputs[1]) { throw 'mixed replay output is non-deterministic' }
          "deterministic_output_sha256=$($outputs[0])" | Add-Content -Encoding ascii soak-head.txt
          Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV,Env:PDW_PRESERVATION_CAPTURE,Env:PDW_PRESERVATION_GOLDEN_CAPTURE,Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue

      - name: Run real 3600-second wall-clock soak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pdw = (Resolve-Path '.\build\Release\PDW.exe').Path
          $fixture = (Resolve-Path '.\soak-evidence\mixed-pocsag-p2000.wav').Path
          $rawTest = (Resolve-Path '.\build\tests\Release\pdw_rx_diagnostics_test.exe').Path
          $filterTest = (Resolve-Path '.\build\tests\Release\pdw_filter_multi_edit_test.exe').Path
          $replayTest = (Resolve-Path '.\build\tests\Release\pdw_rx_raw_log_replay_test.exe').Path

          $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
          # The replay policy requires a capture target. NUL intentionally
          # prevents a 60-minute preservation trace from becoming unbounded;
          # deterministic replay was proved immediately above with real files.
          $env:PDW_PRESERVATION_CAPTURE = 'NUL'
          $env:PDW_PRESERVATION_REPLAY_EXIT = '1'
          $env:PDW_PRESERVATION_SOAK_SECONDS = '3600'

          $started = [DateTime]::UtcNow
          $p = Start-Process -FilePath $pdw -WorkingDirectory $PWD -PassThru
          Start-Sleep -Seconds 2
          $p.Refresh()
          if ($p.HasExited) { throw "PDW exited before soak began rc=$($p.ExitCode)" }

          $initialPrivate = [int64]$p.PrivateMemorySize64
          $initialWorking = [int64]$p.WorkingSet64
          $initialHandles = [int]$p.HandleCount
          $maxPrivate = $initialPrivate
          $maxWorking = $initialWorking
          $maxHandles = $initialHandles
          $samples = 0
          $rawCycles = 0
          "utc,elapsed_s,private_bytes,working_set_bytes,handles,cpu_seconds" | Set-Content -Encoding ascii soak-evidence\resources.csv

          while (-not $p.HasExited) {
            Start-Sleep -Seconds 60
            $p.Refresh()
            if ($p.HasExited) { break }
            $elapsed = ([DateTime]::UtcNow - $started).TotalSeconds
            $private = [int64]$p.PrivateMemorySize64
            $working = [int64]$p.WorkingSet64
            $handles = [int]$p.HandleCount
            $cpu = [double]$p.TotalProcessorTime.TotalSeconds
            $maxPrivate = [Math]::Max($maxPrivate, $private)
            $maxWorking = [Math]::Max($maxWorking, $working)
            $maxHandles = [Math]::Max($maxHandles, $handles)
            $samples++
            "$([DateTime]::UtcNow.ToString('o')),$([Math]::Round($elapsed,3)),$private,$working,$handles,$([Math]::Round($cpu,3))" | Add-Content -Encoding ascii soak-evidence\resources.csv

            # Repeatedly exercise the bounded raw-log start/write/stop/flush,
            # raw-log import boundary and multiple-edit preserve/override tests
            # while the exact-head decoder soak remains alive.
            & $rawTest | Out-Host
            if ($LASTEXITCODE -ne 0) { $p.Kill(); throw 'raw-log lifecycle regression failed during soak' }
            & $replayTest | Out-Host
            if ($LASTEXITCODE -ne 0) { $p.Kill(); throw 'raw-log replay regression failed during soak' }
            & $filterTest | Out-Host
            if ($LASTEXITCODE -ne 0) { $p.Kill(); throw 'filter regression failed during soak' }
            $rawCycles++

            if ($elapsed -gt 3720) { $p.Kill(); throw 'PDW soak exceeded 3720 seconds without clean exit' }
          }

          $p.WaitForExit()
          $ended = [DateTime]::UtcNow
          $elapsedTotal = ($ended - $started).TotalSeconds
          if ($p.ExitCode -ne 0) { throw "PDW soak exited rc=$($p.ExitCode)" }
          if ($elapsedTotal -lt 3600) { throw "wall-clock soak too short: $elapsedTotal seconds" }
          if ($samples -lt 58) { throw "insufficient liveness/resource samples: $samples" }
          if ($rawCycles -lt 58) { throw "insufficient raw/filter lifecycle cycles: $rawCycles" }

          # Fail closed on runaway resource growth. The thresholds allow normal
          # allocator high-water behavior while detecting sustained unbounded
          # growth or leaked handles over this deterministic one-hour workload.
          $privateDelta = $maxPrivate - $initialPrivate
          $workingDelta = $maxWorking - $initialWorking
          $handleDelta = $maxHandles - $initialHandles
          if ($privateDelta -gt 67108864) { throw "private memory growth exceeded 64 MiB: $privateDelta" }
          if ($workingDelta -gt 67108864) { throw "working-set growth exceeded 64 MiB: $workingDelta" }
          if ($handleDelta -gt 32) { throw "handle growth exceeded 32: $handleDelta" }

          "ended_utc=$($ended.ToString('o'))" | Add-Content -Encoding ascii soak-head.txt
          "elapsed_seconds=$([Math]::Round($elapsedTotal,3))" | Add-Content -Encoding ascii soak-head.txt
          "resource_samples=$samples" | Add-Content -Encoding ascii soak-head.txt
          "raw_filter_cycles=$rawCycles" | Add-Content -Encoding ascii soak-head.txt
          "private_initial=$initialPrivate" | Add-Content -Encoding ascii soak-head.txt
          "private_max=$maxPrivate" | Add-Content -Encoding ascii soak-head.txt
          "private_delta=$privateDelta" | Add-Content -Encoding ascii soak-head.txt
          "working_initial=$initialWorking" | Add-Content -Encoding ascii soak-head.txt
          "working_max=$maxWorking" | Add-Content -Encoding ascii soak-head.txt
          "working_delta=$workingDelta" | Add-Content -Encoding ascii soak-head.txt
          "handles_initial=$initialHandles" | Add-Content -Encoding ascii soak-head.txt
          "handles_max=$maxHandles" | Add-Content -Encoding ascii soak-head.txt
          "handles_delta=$handleDelta" | Add-Content -Encoding ascii soak-head.txt
          "fixture_sha256=$((Get-Content soak-evidence\fixture.sha256).Trim())" | Add-Content -Encoding ascii soak-head.txt
          "result=PASS" | Add-Content -Encoding ascii soak-head.txt

          Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV,Env:PDW_PRESERVATION_CAPTURE,Env:PDW_PRESERVATION_REPLAY_EXIT,Env:PDW_PRESERVATION_SOAK_SECONDS -ErrorAction SilentlyContinue

      - name: Re-run full suite after soak
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDW-60m-soak-evidence-${{ github.sha }}
          path: |
            soak-head.txt
            soak-evidence/
            portable/
          if-no-files-found: error
          retention-days: 14
