name: One-shot filter matcher integration

on:
  push:
    branches:
      - modernization/filter-editor-usability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization/filter-editor-usability
          fetch-depth: 0

      - name: Apply byte-safe matcher integration
        run: python3 tools/apply_filter_match_integration.py

      - name: Commit integration if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Misc.cpp; then
            echo "Matcher integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Misc.cpp
          git commit -m "Integrate bounded text filter matcher"
          git push origin HEAD:modernization/filter-editor-usability
