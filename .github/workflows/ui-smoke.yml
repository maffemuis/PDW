name: PDW Windows UI smoke

on:
  workflow_dispatch:
  push:
    branches:
      - modernization/windows11-ui
    paths:
      - "utils/windows11_*.cpp"
      - "utils/windows11_ui.h"
      - "gfx_startup_guard.cpp"
      - ".github/workflows/ui-smoke.yml"

jobs:
  ui-smoke:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare VS2022 CMake
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $cmake = Get-Command cmake.exe -ErrorAction SilentlyContinue
          if (-not $cmake) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              throw "CMake is not on PATH and vswhere.exe was not found."
            }
            $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
            if (-not $vsInstall) { throw "Visual Studio C++ build tools were not found." }
            $cmakeDir = Join-Path $vsInstall "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
            $cmakeExe = Join-Path $cmakeDir "cmake.exe"
            if (-not (Test-Path $cmakeExe)) { throw "Visual Studio CMake component is missing." }
            $cmakeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Configure UI smoke build
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          cmake -S . -B build-ui `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF

      - name: Build UI smoke executable
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: cmake --build build-ui --config Release

      - name: Capture main-window screenshot
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class PdwWindowCapture {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [StructLayout(LayoutKind.Sequential)]
              public struct RECT {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr hWnd);

              [DllImport("user32.dll", CharSet=CharSet.Unicode)]
              public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int maxCount);

              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);

              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint flags);

              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool SetWindowPos(IntPtr hWnd, IntPtr insertAfter,
                  int x, int y, int cx, int cy, uint flags);

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int command);

              public static IntPtr FindLargestWindowForProcess(uint processId, out string diagnostics) {
                  IntPtr best = IntPtr.Zero;
                  long bestArea = -1;
                  StringBuilder log = new StringBuilder();

                  EnumWindows(delegate(IntPtr hwnd, IntPtr state) {
                      uint pid;
                      GetWindowThreadProcessId(hwnd, out pid);
                      if (pid != processId) return true;

                      RECT rect;
                      if (!GetWindowRect(hwnd, out rect)) return true;
                      int width = rect.Right - rect.Left;
                      int height = rect.Bottom - rect.Top;
                      long area = (long)Math.Max(0, width) * Math.Max(0, height);
                      StringBuilder title = new StringBuilder(512);
                      GetWindowText(hwnd, title, title.Capacity);
                      bool visible = IsWindowVisible(hwnd);
                      log.AppendLine(String.Format("hwnd=0x{0:X} visible={1} size={2}x{3} title={4}",
                          hwnd.ToInt64(), visible, width, height, title.ToString()));

                      if (area > bestArea) {
                          bestArea = area;
                          best = hwnd;
                      }
                      return true;
                  }, IntPtr.Zero);

                  diagnostics = log.ToString();
                  return best;
              }
          }
          "@

          $exe = (Resolve-Path ".\build-ui\Release\PDW.exe").Path
          $outDir = Join-Path $PWD "ui-smoke"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $png = Join-Path $outDir "pdw-main-window.png"
          $diagnosticsPath = Join-Path $outDir "window-diagnostics.txt"

          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            $hwnd = [IntPtr]::Zero
            $diagnostics = ""
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) {
                throw "PDW exited before a top-level window became available (exit $($process.ExitCode))."
              }
              $hwnd = [PdwWindowCapture]::FindLargestWindowForProcess([uint32]$process.Id, [ref]$diagnostics)
            } while ($hwnd -eq [IntPtr]::Zero -and (Get-Date) -lt $deadline)

            @(
              "process_id=$($process.Id)"
              "process_name=$($process.ProcessName)"
              "main_window_handle=$($process.MainWindowHandle)"
              "enumerated_windows:"
              $diagnostics
            ) | Set-Content -Path $diagnosticsPath -Encoding UTF8

            if ($hwnd -eq [IntPtr]::Zero) {
              throw "PDW did not expose any top-level window within 20 seconds."
            }

            [PdwWindowCapture]::ShowWindow($hwnd, 9) | Out-Null
            [PdwWindowCapture]::SetWindowPos($hwnd, [IntPtr]::Zero, 80, 80, 1280, 820, 0x0014) | Out-Null
            Start-Sleep -Seconds 2

            $rect = New-Object PdwWindowCapture+RECT
            if (-not [PdwWindowCapture]::GetWindowRect($hwnd, [ref]$rect)) {
              throw "GetWindowRect failed."
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -lt 200 -or $height -lt 120) {
              throw "Captured PDW window size is unexpectedly small: ${width}x${height}."
            }

            $bitmap = New-Object System.Drawing.Bitmap($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $hdc = $graphics.GetHdc()
            try {
              $captured = [PdwWindowCapture]::PrintWindow($hwnd, $hdc, 2)
            }
            finally {
              $graphics.ReleaseHdc($hdc)
              $graphics.Dispose()
            }

            if (-not $captured) {
              $bitmap.Dispose()
              throw "PrintWindow failed to capture the PDW top-level window."
            }

            $bitmap.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
            $bitmap.Dispose()
            Write-Host "UI screenshot saved to $png (${width}x${height})."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDW-Windows11-UI-smoke
          path: |
            ui-smoke/pdw-main-window.png
            ui-smoke/window-diagnostics.txt
            build-ui/Release/PDW.exe
          if-no-files-found: warn
          retention-days: 30
