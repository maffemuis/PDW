name: Restore bounded TEST/SYNTHETIC message

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - .github/workflows/restore-synthetic-test-message.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact current and source heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4e92fef2ef0f1c75d27526a772bc15fe5f296925"
          test "${GITHUB_REF_NAME}" = "modernization/filter-editor-usability"
          git fetch --no-tags origin modernization/synthetic-groupcall-guard
          test "$(git rev-parse FETCH_HEAD)" = "658230d4a11f1e2a7fee1df33d078a6bd2c7816c"

      - name: Port only bounded synthetic-message implementation
        shell: bash
        run: |
          set -euo pipefail
          SRC=658230d4a11f1e2a7fee1df33d078a6bd2c7816c
          for path in \
            core/legacy_message_projection.h \
            core/legacy_message_projection.cpp \
            core/synthetic_message.h \
            core/synthetic_message.cpp \
            core/synthetic_injection_policy.h \
            core/synthetic_injection_policy.cpp \
            utils/synthetic_injection.h \
            utils/synthetic_injection.cpp \
            tests/core/legacy_message_projection_test.cpp \
            tests/core/synthetic_message_test.cpp \
            tests/core/synthetic_injection_policy_test.cpp \
            tests/core/synthetic_mail_contract_test.cpp
          do
            mkdir -p "$(dirname "$path")"
            git show "$SRC:$path" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          def text_patch(path, old, new, count=1):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              actual = data.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}')
              p.write_text(data.replace(old, new, count), encoding='utf-8')

          text_patch('core/CMakeLists.txt',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.h\n',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.h\n')
          text_patch('core/CMakeLists.txt',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.cpp\n',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.cpp\n')

          text_patch('utils/CMakeLists.txt',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.h\n',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.h\n')
          text_patch('utils/CMakeLists.txt',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.cpp\n',
              '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.cpp\n')

          tests_anchor = '''add_test(
    NAME pdw_decoded_message
    COMMAND pdw_decoded_message_test
)

'''
          tests_block = '''add_executable( pdw_synthetic_message_test
    core/synthetic_message_test.cpp
    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp
    ${CMAKE_SOURCE_DIR}/core/synthetic_message.cpp
)

target_include_directories( pdw_synthetic_message_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_synthetic_message
    COMMAND pdw_synthetic_message_test
)

add_executable( pdw_synthetic_injection_policy_test
    core/synthetic_injection_policy_test.cpp
    ${CMAKE_SOURCE_DIR}/core/synthetic_injection_policy.cpp
)

target_include_directories( pdw_synthetic_injection_policy_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_synthetic_injection_policy
    COMMAND pdw_synthetic_injection_policy_test
)

add_executable( pdw_legacy_message_projection_test
    core/legacy_message_projection_test.cpp
    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp
    ${CMAKE_SOURCE_DIR}/core/legacy_message_projection.cpp
)

target_include_directories( pdw_legacy_message_projection_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_legacy_message_projection
    COMMAND pdw_legacy_message_projection_test
)

add_executable( pdw_synthetic_mail_contract_test
    core/synthetic_mail_contract_test.cpp
    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp
    ${CMAKE_SOURCE_DIR}/core/synthetic_message.cpp
    ${CMAKE_SOURCE_DIR}/core/legacy_message_projection.cpp
)

target_include_directories( pdw_synthetic_mail_contract_test PRIVATE
    ${CMAKE_SOURCE_DIR}/core
)

add_test(
    NAME pdw_synthetic_mail_contract
    COMMAND pdw_synthetic_mail_contract_test
)

'''
          text_patch('tests/CMakeLists.txt', tests_anchor, tests_anchor + tests_block)

          def latin1_patch(path, old, new, count=1):
              p = Path(path)
              data = p.read_bytes().decode('latin-1')
              actual = data.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}')
              p.write_bytes(data.replace(old, new, count).encode('latin-1'))

          latin1_patch('Headers/Resource.h',
              '#define IDM_FILTERCOMMANDFILE      245\n',
              '#define IDM_FILTERCOMMANDFILE      245\n#define IDM_TEST_MESSAGE            246\n')

          latin1_patch('Rsrc.rc',
              '        MENUITEM "Filter Command File",         IDM_FILTERCOMMANDFILE\n',
              '        MENUITEM "Filter Command File",         IDM_FILTERCOMMANDFILE\n        MENUITEM SEPARATOR\n        MENUITEM "Send TEST/SYNTHETIC message...", IDM_TEST_MESSAGE\n')

          latin1_patch('PDW.cpp',
              '#include "utils\\smtp.h"\n',
              '#include "utils\\smtp.h"\n#include "utils\\synthetic_injection.h"\n')

          about = '''\t\t\t\tcase IDM_ABOUT:\n\t\t\t\t\tGoModalDialogBoxParam(ghInstance, MAKEINTRESOURCE(ABOUTDLGBOX),\n\t\t\t\t\t\t\t\t\t\t\t hWnd, (DLGPROC) AboutDlgProc, 0L);\n\t\t\t\tbreak;\n'''
          synthetic = '''\n\t\t\t\tcase IDM_TEST_MESSAGE:\n\t\t\t\t\tif (MessageBox(hWnd, "Inject a clearly marked TEST/SYNTHETIC message through the normal filter/action pipeline?\\n\\nCapcode: 1234567\\nText: PDW TEST MESSAGE", "PDW Synthetic Test", MB_YESNO | MB_ICONWARNING | MB_DEFBUTTON2) == IDYES)\n\t\t\t\t\t{\n\t\t\t\t\t\tif (!pdw::InjectDefaultSyntheticTestMessage())\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tMessageBox(hWnd, "Synthetic test injection was rejected safely.", "PDW Synthetic Test", MB_OK | MB_ICONERROR);\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\tbreak;\n'''
          latin1_patch('PDW.cpp', about, about + synthetic)
          PY

      - name: Verify bounded scope and no scenario/network additions
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-synthetic-test-message.yml
          git diff --check
          ! git diff -- . | grep -E 'Scenario Test|Main/Slave|remote forwarding' || exit 1
          grep -q 'Send TEST/SYNTHETIC message' Rsrc.rc
          grep -q 'InjectDefaultSyntheticTestMessage' PDW.cpp
          grep -q 'CanInjectSyntheticMessage' utils/synthetic_injection.cpp
          test ! -e .github/workflows/restore-synthetic-test-message.yml

      - name: Commit and push exact bounded feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core utils tests PDW.cpp Headers/Resource.h Rsrc.rc .github/workflows/restore-synthetic-test-message.yml
          git diff --cached --check
          git commit -m "Restore bounded TEST synthetic message"
          git fetch origin modernization/filter-editor-usability
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/modernization/filter-editor-usability)"
          git push origin HEAD:modernization/filter-editor-usability
