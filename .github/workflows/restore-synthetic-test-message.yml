name: Restore bounded TEST/SYNTHETIC message

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - .github/workflows/restore-synthetic-test-message.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact current and source heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f7a20adb4c7fe38e906552dea5f742b3e3b8d1f7"
          test "${GITHUB_REF_NAME}" = "modernization/filter-editor-usability"
          git fetch --no-tags origin modernization/synthetic-groupcall-guard
          test "$(git rev-parse FETCH_HEAD)" = "658230d4a11f1e2a7fee1df33d078a6bd2c7816c"

      - name: Port bounded synthetic implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          SRC=658230d4a11f1e2a7fee1df33d078a6bd2c7816c
          for path in core/legacy_message_projection.h core/legacy_message_projection.cpp core/synthetic_message.h core/synthetic_message.cpp core/synthetic_injection_policy.h core/synthetic_injection_policy.cpp utils/synthetic_injection.h utils/synthetic_injection.cpp tests/core/legacy_message_projection_test.cpp tests/core/synthetic_message_test.cpp tests/core/synthetic_injection_policy_test.cpp tests/core/synthetic_mail_contract_test.cpp; do
            mkdir -p "$(dirname "$path")"
            git show "$SRC:$path" > "$path"
          done
          python3 - <<'PY'
          from pathlib import Path
          def patch_text(path, old, new):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              if data.count(old) != 1:
                  raise SystemExit(path + ': text anchor mismatch')
              p.write_text(data.replace(old, new, 1), encoding='utf-8')
          patch_text('core/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.h\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.h\n')
          patch_text('core/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.cpp\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/filter_text_storage.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/legacy_message_projection.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_message.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection_policy.cpp\n')
          patch_text('utils/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.h\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.h\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.h\n')
          patch_text('utils/CMakeLists.txt', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.cpp\n', '  ${CMAKE_CURRENT_SOURCE_DIR}/smtp_protocol.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_injection.cpp\n')
          anchor = 'add_test(\n    NAME pdw_decoded_message\n    COMMAND pdw_decoded_message_test\n)\n\n'
          block = 'add_executable( pdw_synthetic_message_test\n    core/synthetic_message_test.cpp\n    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp\n    ${CMAKE_SOURCE_DIR}/core/synthetic_message.cpp\n)\n\ntarget_include_directories( pdw_synthetic_message_test PRIVATE\n    ${CMAKE_SOURCE_DIR}/core\n)\n\nadd_test(\n    NAME pdw_synthetic_message\n    COMMAND pdw_synthetic_message_test\n)\n\nadd_executable( pdw_synthetic_injection_policy_test\n    core/synthetic_injection_policy_test.cpp\n    ${CMAKE_SOURCE_DIR}/core/synthetic_injection_policy.cpp\n)\n\ntarget_include_directories( pdw_synthetic_injection_policy_test PRIVATE\n    ${CMAKE_SOURCE_DIR}/core\n)\n\nadd_test(\n    NAME pdw_synthetic_injection_policy\n    COMMAND pdw_synthetic_injection_policy_test\n)\n\nadd_executable( pdw_legacy_message_projection_test\n    core/legacy_message_projection_test.cpp\n    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp\n    ${CMAKE_SOURCE_DIR}/core/legacy_message_projection.cpp\n)\n\ntarget_include_directories( pdw_legacy_message_projection_test PRIVATE\n    ${CMAKE_SOURCE_DIR}/core\n)\n\nadd_test(\n    NAME pdw_legacy_message_projection\n    COMMAND pdw_legacy_message_projection_test\n)\n\nadd_executable( pdw_synthetic_mail_contract_test\n    core/synthetic_mail_contract_test.cpp\n    ${CMAKE_SOURCE_DIR}/core/decoded_message.cpp\n    ${CMAKE_SOURCE_DIR}/core/synthetic_message.cpp\n    ${CMAKE_SOURCE_DIR}/core/legacy_message_projection.cpp\n)\n\ntarget_include_directories( pdw_synthetic_mail_contract_test PRIVATE\n    ${CMAKE_SOURCE_DIR}/core\n)\n\nadd_test(\n    NAME pdw_synthetic_mail_contract\n    COMMAND pdw_synthetic_mail_contract_test\n)\n\n'
          patch_text('tests/CMakeLists.txt', anchor, anchor + block)
          def patch_latin1(path, old, new):
              p = Path(path)
              data = p.read_bytes().decode('latin-1')
              if data.count(old) != 1:
                  raise SystemExit(path + ': latin1 anchor mismatch')
              p.write_bytes(data.replace(old, new, 1).encode('latin-1'))
          patch_latin1('Headers/Resource.h', '#define IDM_FILTERCOMMANDFILE      245\n', '#define IDM_FILTERCOMMANDFILE      245\n#define IDM_TEST_MESSAGE            246\n')
          patch_latin1('Rsrc.rc', '        MENUITEM "Filter Command File",         IDM_FILTERCOMMANDFILE\n', '        MENUITEM "Filter Command File",         IDM_FILTERCOMMANDFILE\n        MENUITEM SEPARATOR\n        MENUITEM "Send TEST/SYNTHETIC message...", IDM_TEST_MESSAGE\n')
          patch_latin1('PDW.cpp', '#include "utils\\smtp.h"\n', '#include "utils\\smtp.h"\n#include "utils\\synthetic_injection.h"\n')
          about = '\t\t\t\tcase IDM_ABOUT:\n\t\t\t\t\tGoModalDialogBoxParam(ghInstance, MAKEINTRESOURCE(ABOUTDLGBOX),\n\t\t\t\t\t\t\t\t\t\t\t hWnd, (DLGPROC) AboutDlgProc, 0L);\n\t\t\t\tbreak;\n'
          synthetic = '\n\t\t\t\tcase IDM_TEST_MESSAGE:\n\t\t\t\t\tif (MessageBox(hWnd, "Inject a clearly marked TEST/SYNTHETIC message through the normal filter/action pipeline?\\n\\nCapcode: 1234567\\nText: PDW TEST MESSAGE", "PDW Synthetic Test", MB_YESNO | MB_ICONWARNING | MB_DEFBUTTON2) == IDYES)\n\t\t\t\t\t{\n\t\t\t\t\t\tif (!pdw::InjectDefaultSyntheticTestMessage())\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tMessageBox(hWnd, "Synthetic test injection was rejected safely.", "PDW Synthetic Test", MB_OK | MB_ICONERROR);\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\tbreak;\n'
          patch_latin1('PDW.cpp', about, about + synthetic)
          PY

      - name: Verify scope, remove helper, commit and push
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Send TEST/SYNTHETIC message' Rsrc.rc
          grep -q 'InjectDefaultSyntheticTestMessage' PDW.cpp
          grep -q 'CanInjectSyntheticMessage' utils/synthetic_injection.cpp
          rm .github/workflows/restore-synthetic-test-message.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core utils tests PDW.cpp Headers/Resource.h Rsrc.rc .github/workflows/restore-synthetic-test-message.yml
          git diff --cached --check
          git commit -m "Restore bounded TEST synthetic message"
          git fetch origin modernization/filter-editor-usability
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/modernization/filter-editor-usability)"
          git push origin HEAD:modernization/filter-editor-usability
