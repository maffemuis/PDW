name: PDW one-shot multiple edit hardening

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - .github/workflows/pdw-one-shot-multiedit.yml
      - utils/pdw_multiedit_once.py

permissions:
  contents: write
  actions: read

jobs:
  harden:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for exact-head Win32 gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expectedParent = '7ae06124d58f6e7fc7c2ada7b2218c8b8583d2a4'
          if ((git rev-parse HEAD^).Trim() -ne $expectedParent) { throw 'stale helper parent' }
          while ($true) {
            $runs = (gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100" | ConvertFrom-Json).workflow_runs
            $build = $runs | Where-Object { $_.name -eq 'Build PDW (Win32)' -and $_.head_sha -eq $env:GITHUB_SHA } | Sort-Object created_at -Descending | Select-Object -First 1
            if (-not $build) { Start-Sleep -Seconds 10; continue }
            if ($build.status -eq 'completed') {
              if ($build.conclusion -ne 'success') { throw "Win32 gate failed: $($build.id) $($build.conclusion)" }
              break
            }
            Start-Sleep -Seconds 10
          }

      - name: Apply bounded patch
        shell: pwsh
        run: python utils/pdw_multiedit_once.py

      - name: Run targeted regression
        shell: pwsh
        run: |
          cmake -S . -B build-multiedit -A Win32 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build build-multiedit --config Release --target pdw_filter_multi_edit_test
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          ctest --test-dir build-multiedit -C Release -R '^pdw_filter_multi_edit$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'regression failed' }

      - name: Commit fix and clean temporary helpers
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/pdw-one-shot-multiedit.yml'
          Remove-Item 'utils/pdw_multiedit_once.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PDW.cpp core/filter_multi_edit.h core/filter_multi_edit.cpp tests/core/filter_multi_edit_test.cpp .github/workflows/pdw-one-shot-multiedit.yml utils/pdw_multiedit_once.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          git commit -m 'Harden multiple filter edit overrides'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:modernization/filter-editor-usability
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
