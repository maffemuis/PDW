name: P2000 sync error matrix

on:
  workflow_dispatch:
  push:
    branches:
      - modernization/p2000-pocsag-hardening

jobs:
  sync-matrix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 Release
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build full PDW
        shell: pwsh
        run: cmake --build build --config Release
      - name: Run full preservation suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run normal/inverted sync error matrix
        shell: pwsh
        run: python .\tests\preservation\run_p2000_sync_matrix.py .\build\Release\PDW.exe
      - name: Upload sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2000-sync-matrix-evidence
          path: preservation-local
          if-no-files-found: warn
