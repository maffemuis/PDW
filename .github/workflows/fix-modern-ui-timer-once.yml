name: Fix modern UI legacy timer once

on:
  push:
    branches:
      - modernization/windows11-ui
    paths:
      - .github/workflows/fix-modern-ui-timer-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization/windows11-ui
          fetch-depth: 0

      - name: Apply bounded timer fix
        shell: cmd
        run: python .github\scripts\fix_modern_ui_timer.py

      - name: Commit source fix
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/windows11_ui.cpp
          git commit -m "Fix modern UI decode timer refresh"
          git push origin HEAD:modernization/windows11-ui
