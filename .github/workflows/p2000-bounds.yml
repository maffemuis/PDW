name: P2000 POCSAG bounds

on:
  workflow_dispatch:
  push:
    branches:
      - modernization/p2000-pocsag-hardening

jobs:
  bounds-regression:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Win32 / Release)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run existing preservation suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate over-boundary synthetic POCSAG fixture
        shell: pwsh
        run: |
          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          python .\tests\preservation\generate_p2000_bounds_fixture.py (Join-Path $outputDir "p2000-1200-bounds.wav")
          if ($LASTEXITCODE -ne 0) { throw "bounds fixture generation failed" }

      - name: Replay over-boundary message through real decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $outputDir = Join-Path $PWD "preservation-local"
          $fixture = Join-Path $outputDir "p2000-1200-bounds.wav"
          $capture = Join-Path $outputDir "p2000-1200-bounds.full.jsonl"
          $actual = Join-Path $outputDir "p2000-1200-bounds.actual.jsonl"
          [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
          [System.IO.File]::WriteAllBytes($actual, [byte[]]@())

          $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
          $env:PDW_PRESERVATION_CAPTURE = $capture
          $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
          $env:PDW_PRESERVATION_REPLAY_EXIT = "1"
          try {
            $process = Start-Process -FilePath $pdw -WorkingDirectory $PWD -PassThru
            if (-not $process.WaitForExit(90000)) {
              $process.Kill()
              throw "bounds replay timeout"
            }
            if ($process.ExitCode -ne 0) {
              throw "bounds replay exited unsafely with $($process.ExitCode)"
            }
          }
          finally {
            Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
          }

      - name: Assert decoder fails closed at bounded message storage
        shell: pwsh
        run: |
          $rows = @(Get-Content ".\preservation-local\p2000-1200-bounds.actual.jsonl" | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json })
          if ($rows.Count -ne 0) {
            $lengths = @($rows | ForEach-Object { ([string]$_.message).Length }) -join ","
            throw "over-boundary POCSAG input must be rejected, but decoder emitted $($rows.Count) plausible message(s) (lengths=$lengths)"
          }

      - name: Upload bounds evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2000-bounds-evidence
          path: preservation-local
          if-no-files-found: warn
