name: PDW Find Filter UI modernize once

on:
  push:
    branches:
      - tmp/find-filter-ui-apply
    paths:
      - .github/workflows/filter-find-ui-modernize-once.yml
      - .github/scripts/filter-find-ui-modernize-once.ps1

permissions:
  contents: write

jobs:
  patch-filter-find-ui:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: tmp/find-filter-ui-apply
          fetch-depth: 0

      - name: Apply bounded Find Filter presentation patch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: .github/scripts/filter-find-ui-modernize-once.ps1
