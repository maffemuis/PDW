name: PDW Custom Audio UI modernize once

on:
  push:
    branches:
      - tmp/custom-audio-ui-apply
    paths:
      - .github/workflows/custom-audio-ui-modernize-once.yml
      - .github/scripts/custom-audio-ui-modernize-once.ps1

permissions:
  contents: write

jobs:
  patch-custom-audio-ui:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: tmp/custom-audio-ui-apply
          fetch-depth: 0

      - name: Apply bounded Custom Audio presentation patch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: .github/scripts/custom-audio-ui-modernize-once.ps1
