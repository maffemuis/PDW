name: One-shot reported filter and mail UI fixes

on:
  push:
    branches:
      - modernization/filter-editor-usability
    paths:
      - tools/apply_user_reported_ui_fixes.py
      - .github/workflows/one-shot-user-reported-ui-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization/filter-editor-usability
          fetch-depth: 0
      - name: Apply byte-safe UI fixes
        run: python3 tools/apply_user_reported_ui_fixes.py
      - name: Commit patched legacy sources
        run: |
          if git diff --quiet -- PDW.cpp Rsrc.rc; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDW.cpp Rsrc.rc
          git commit -m "Fix reported multi-edit and SSL/TLS UI behavior"
          git push origin HEAD:modernization/filter-editor-usability
