name: Apply main UI stability patch once

on:
  push:
    branches:
      - modernization/windows11-ui
    paths:
      - .github/workflows/main-ui-stability-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization/windows11-ui
          fetch-depth: 0

      - name: Apply bounded UI patch
        shell: powershell
        run: ./.github/scripts/apply_main_ui_stability.ps1

      - name: Commit source patch and remove helpers
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/windows11_ui.cpp utils/windows11_pane_skin.cpp
          git rm .github/scripts/apply_main_ui_stability.ps1 .github/workflows/main-ui-stability-once.yml
          git commit -m "Stabilize main UI rendering and restore RX quality meter"
          git push origin HEAD:modernization/windows11-ui
