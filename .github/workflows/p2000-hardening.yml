name: P2000 POCSAG hardening

on:
  workflow_dispatch:
  push:
    branches:
      - modernization/p2000-pocsag-hardening

jobs:
  p2000-regressions:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Win32 / Release)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run existing preservation suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run P2000 short-alpha regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $compare = (Resolve-Path ".\build\tests\Release\pdw_preservation_compare.exe").Path
          $expected = (Resolve-Path ".\tests\preservation\golden\p2000-1200-short-alpha.jsonl").Path
          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $fixture = Join-Path $outputDir "p2000-1200-short-alpha.wav"
          $capture = Join-Path $outputDir "p2000-1200-short-alpha.full.jsonl"
          $actual = Join-Path $outputDir "p2000-1200-short-alpha.actual.jsonl"

          python .\tests\preservation\generate_p2000_fixture.py $fixture short-alpha
          if ($LASTEXITCODE -ne 0) { throw "short-alpha fixture generation failed" }
          [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
          [System.IO.File]::WriteAllBytes($actual, [byte[]]@())
          $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
          $env:PDW_PRESERVATION_CAPTURE = $capture
          $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
          $env:PDW_PRESERVATION_REPLAY_EXIT = "1"
          try {
            $process = Start-Process -FilePath $pdw -WorkingDirectory $PWD -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "short-alpha replay timeout" }
            if ($process.ExitCode -ne 0) { throw "short-alpha replay exit $($process.ExitCode)" }
            & $compare $expected $actual
            if ($LASTEXITCODE -ne 0) { throw "short-alpha golden mismatch" }
          }
          finally {
            Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
          }

      - name: Capture P2000 uncorrectable-address case
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pdw = (Resolve-Path ".\build\Release\PDW.exe").Path
          $outputDir = Join-Path $PWD "preservation-local"
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $fixture = Join-Path $outputDir "p2000-1200-bad-address.wav"
          $capture = Join-Path $outputDir "p2000-1200-bad-address.full.jsonl"
          $actual = Join-Path $outputDir "p2000-1200-bad-address.actual.jsonl"

          python .\tests\preservation\generate_p2000_fixture.py $fixture bad-address
          if ($LASTEXITCODE -ne 0) { throw "bad-address fixture generation failed" }
          [System.IO.File]::WriteAllBytes($capture, [byte[]]@())
          [System.IO.File]::WriteAllBytes($actual, [byte[]]@())
          $env:PDW_PRESERVATION_REPLAY_WAV = $fixture
          $env:PDW_PRESERVATION_CAPTURE = $capture
          $env:PDW_PRESERVATION_GOLDEN_CAPTURE = $actual
          $env:PDW_PRESERVATION_REPLAY_EXIT = "1"
          try {
            $process = Start-Process -FilePath $pdw -WorkingDirectory $PWD -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "bad-address replay timeout" }
            if ($process.ExitCode -ne 0) { throw "bad-address replay exit $($process.ExitCode)" }
          }
          finally {
            Remove-Item Env:PDW_PRESERVATION_REPLAY_WAV -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_GOLDEN_CAPTURE -ErrorAction SilentlyContinue
            Remove-Item Env:PDW_PRESERVATION_REPLAY_EXIT -ErrorAction SilentlyContinue
          }

      - name: Assert bad address is not shown as a plausible capcode
        shell: pwsh
        run: |
          $rows = @(Get-Content ".\preservation-local\p2000-1200-bad-address.actual.jsonl" | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json })
          if ($rows.Count -ne 1) { throw "expected exactly one captured message, got $($rows.Count)" }
          if ($rows[0].capcode -ne "???????") { throw "uncorrectable address leaked as capcode: $($rows[0].capcode)" }

      - name: Assert bad address clears POCSAG function
        shell: pwsh
        run: |
          $row = (Get-Content ".\preservation-local\p2000-1200-bad-address.actual.jsonl" | Where-Object { $_.Trim() } | Select-Object -First 1 | ConvertFrom-Json)
          if ($row.mode -ne "POCSAG-0") { throw "unexpected invalid-address mode: $($row.mode)" }

      - name: Assert bad address preserves decoded message payload
        shell: pwsh
        run: |
          $row = (Get-Content ".\preservation-local\p2000-1200-bad-address.actual.jsonl" | Where-Object { $_.Trim() } | Select-Object -First 1 | ConvertFrom-Json)
          if ($row.type -ne " ALPHA ") { throw "unexpected invalid-address type: $($row.type)" }
          if ($row.bitrate -ne "1200") { throw "unexpected invalid-address bitrate: $($row.bitrate)" }
          if ($row.message -ne "BRANDWEER TEST") { throw "invalid-address payload changed: $($row.message)" }

      - name: Compare P2000 uncorrectable-address golden
        shell: pwsh
        run: |
          $compare = (Resolve-Path ".\build\tests\Release\pdw_preservation_compare.exe").Path
          $expected = (Resolve-Path ".\tests\preservation\golden\p2000-1200-bad-address.jsonl").Path
          $actual = (Resolve-Path ".\preservation-local\p2000-1200-bad-address.actual.jsonl").Path
          & $compare $expected $actual
          if ($LASTEXITCODE -ne 0) { throw "bad-address golden mismatch" }

      - name: Upload P2000 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2000-regression-evidence
          path: preservation-local
          if-no-files-found: warn
