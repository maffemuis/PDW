name: One-shot filter editor UI patch

on:
  push:
    branches:
      - modernization/filter-editor-usability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization/filter-editor-usability
          fetch-depth: 0

      - name: Apply filter editor UI patch
        run: python3 tools/apply_filter_editor_ui_patch.py

      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- PDW.cpp; then
            echo "Filter editor UI patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDW.cpp
          git commit -m "Integrate filter editor caret and multi-edit fixes"
          git push origin HEAD:modernization/filter-editor-usability
