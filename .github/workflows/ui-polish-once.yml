name: PDW UI polish once

on:
  push:
    branches:
      - modernization/windows11-ui
    paths:
      - ".github/workflows/ui-polish-once.yml"

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: modernization/windows11-ui
          fetch-depth: 1

      - name: Apply bounded presentation-only fixes
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $path = "utils/windows11_ui.cpp"
          $text = [System.IO.File]::ReadAllText($path)
          $nl = [Environment]::NewLine

          function Replace-Once([string]$old, [string]$new, [string]$label) {
            $first = $script:text.IndexOf($old, [StringComparison]::Ordinal)
            if ($first -lt 0) { throw "Expected UI source fragment not found: $label" }
            if ($script:text.IndexOf($old, $first + $old.Length, [StringComparison]::Ordinal) -ge 0) {
              throw "UI source fragment is not unique: $label"
            }
            $script:text = $script:text.Substring(0, $first) + $new + $script:text.Substring($first + $old.Length)
          }

          Replace-Once "        const bool active = dRX_Quality > 0.0;" "        const bool active = !bPauseFlag && dRX_Quality > 0.0;" "card RX pause state"
          Replace-Once "    const COLORREF green = RGB(20, 170, 62);" ("    const COLORREF green = RGB(20, 170, 62);" + $nl + "    const COLORREF paused = RGB(196, 120, 0);") "status palette"
          Replace-Once "    const int dot = ScaleForDpi(hwnd, 10);" ("    const int dot = ScaleForDpi(hwnd, 10);" + $nl + "    const COLORREF stateColor = bPauseFlag ? paused : green;") "status state color"
          Replace-Once "    HBRUSH dotBrush = CreateSolidBrush(green);" "    HBRUSH dotBrush = CreateSolidBrush(stateColor);" "paused status brush"
          Replace-Once "    HPEN dotPen = CreatePen(PS_SOLID, 1, green);" "    HPEN dotPen = CreatePen(PS_SOLID, 1, stateColor);" "paused status pen"
          Replace-Once "    const bool rxActive = dRX_Quality > 0.0;" "    const bool rxActive = !bPauseFlag && dRX_Quality > 0.0;" "status RX pause state"

          $pattern = '(?m)(LRESULT CALLBACK MainWindowSubclassProc\(HWND hwnd, UINT message, WPARAM wParam,\r?\n\s+LPARAM lParam, UINT_PTR subclassId,\r?\n\s+DWORD_PTR referenceData\)\r?\n\{\r?\n)'
          $matches = [regex]::Matches($text, $pattern)
          if ($matches.Count -ne 1) { throw "MainWindowSubclassProc signature was not uniquely found." }
          $block = @(
            '    if (message == WM_GETMINMAXINFO)',
            '    {',
            '        const LRESULT result = DefSubclassProc(hwnd, message, wParam, lParam);',
            '        MINMAXINFO* info = reinterpret_cast<MINMAXINFO*>(lParam);',
            '        const int minWidth = ScaleForDpi(hwnd, 900);',
            '        const int minHeight = ScaleForDpi(hwnd, 600);',
            '        if (info->ptMinTrackSize.x < minWidth) info->ptMinTrackSize.x = minWidth;',
            '        if (info->ptMinTrackSize.y < minHeight) info->ptMinTrackSize.y = minHeight;',
            '        return result;',
            '    }',
            '',
            ''
          ) -join $nl
          $text = [regex]::Replace($text, $pattern, ('$1' + $block), 1)

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)
          git diff --check
          git diff -- $path

      - name: Commit UI-only change and remove one-shot helper
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-polish-once.yml
          git add utils/windows11_ui.cpp
          git diff --cached --check
          git commit -m "Polish paused state and minimum window size"
          git push origin HEAD:modernization/windows11-ui
